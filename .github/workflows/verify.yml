name: verify

on:
  push:
    branches: [master, feat/**, backup/**]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Environment setup
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev
      - name: Upstream engine at 445e314 (patch diagnostic + JNI compile)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/JamesQiu2005/SpektraLab.git upstream
          git -C upstream fetch --depth 1 origin 445e314e28b9b455d2457471fadaffd28c07270b
          git -C upstream checkout --detach FETCH_HEAD
      - name: Offline verification
        # One source of truth: scripts/verify.ps1 runs every check, including
        # the C++ compile and RUN checks (g++ is on the ubuntu host).
        shell: pwsh
        run: |
          $ndk = Join-Path $env:ANDROID_HOME 'ndk/28.2.13676358'
          ./scripts/verify.ps1 -JavaHome $env:JAVA_HOME -AndroidSdkRoot $env:ANDROID_HOME -NdkPath $ndk -EngineRoot (Join-Path $PWD 'upstream')
