name: verify

on:
  push:
    branches: [master, feat/**, backup/**]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      # setup-android@v3 runs `sdkmanager tools`, a package Google removed, so
      # install the SDK components directly on the pre-provisioned runner image.
      - name: Environment setup
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found under $ANDROID_HOME" >&2; exit 1; fi
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev
      - name: Upstream engine at 445e314 (patch diagnostic + JNI compile)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/JamesQiu2005/SpektraLab.git upstream
          git -C upstream fetch --depth 1 origin 445e314e28b9b455d2457471fadaffd28c07270b
          git -C upstream checkout --detach FETCH_HEAD
      - name: Offline verification
        # One source of truth: scripts/verify.ps1 runs every check, including
        # the C++ compile and RUN checks (g++ is on the ubuntu host).
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { '/usr/local/lib/android/sdk' }
          $ndk = Join-Path $sdk 'ndk/28.2.13676358'
          ./scripts/verify.ps1 -JavaHome $env:JAVA_HOME -AndroidSdkRoot $sdk -NdkPath $ndk -EngineRoot (Join-Path $PWD 'upstream')
          # verify.ps1 throws on real failures; a diagnostic native WARN may
          # still leave a non-zero exit code, which is not a failed job.
          exit 0

  release:
    # Fork PRs cannot read repository secrets, so they only run the offline job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.RELEASE_STOREPASS }}
          KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
        run: |
          foreach ($name in 'KEYSTORE_B64', 'STOREPASS', 'KEYALIAS') {
            if ([string]::IsNullOrEmpty((Get-Item "env:$name").Value)) {
              throw "Missing GitHub secret for release signing: $name"
            }
          }
      - name: Install build tools
        shell: pwsh
        run: ./scripts/setup-windows.ps1 -AcceptAndroidLicenses
      - name: Build release-signed full APK from source (with Fotufilm)
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.RELEASE_STOREPASS }}
          KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_B64))
          try {
            ./scripts/build-windows.ps1 `
              -ReleaseKeystore $keystore `
              -ReleaseStorePass $env:STOREPASS `
              -ReleaseKeyAlias $env:KEYALIAS `
              -WithFotufilm `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP 'apk')
          } finally {
            Remove-Item -LiteralPath $keystore -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-release-signed-with-fotufilm
          path: ${{ runner.temp }}/apk/SpektraLab-release-signed-with-fotufilm.apk
          if-no-files-found: error
